[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-django-service"
version = "1.0.0"
description = "Python Django Packaging Demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.0.4",
    "gunicorn>=22.0.0",
    "python-dotenv>=1.0.1"
]
